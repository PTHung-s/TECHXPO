<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Medly</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  
  <!-- Favicon links - multiple sizes for different devices -->
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  
  <!-- Fallback favicon -->
  <link rel="shortcut icon" href="/favicon.ico">
  
  <!-- External CSS (đÃ tách 3 file; GIỮ ĐÚNG THỨ TỰ) -->
  <link rel="stylesheet" href="styles.01-core.css">
  <link rel="stylesheet" href="styles.02-flow-and-cards.css">
  <link rel="stylesheet" href="styles.03-themes.css">
</head>
<body class="landing-dark">
  <div id="app">
    <header>
      <div class="app-title">
        <div class="logo-container" id="logoContainer">
          <img id="logoImg" src="" alt="Logo" style="display:none;">
          <div id="logoFallback" class="fallback">AI</div>
        </div>
        <div class="logo-section">
          <div id="statusDot" class="connecting"></div>
          <h1>Trợ lí ảo</h1>
        </div>
      </div>
      <div id="callBar">
        <div id="timer">00:00</div>
        <div style="display:flex; gap:.5rem;">
          <button id="btnMute" class="ghost">Tắt mic</button>
          <button id="btnUnmute" class="ghost hidden">Bật mic</button>
          <button id="btnLog" class="ghost" style="min-width:42px;">Log</button>
        </div>
      </div>
    </header>
    <div class="flow-progress-wrapper hidden" id="flowWrapper">
      <div class="flow-progress" id="flowProgress">
        <div class="flow-bar-fill" id="flowBarFill"><div class="trail">
          <span style="animation-delay:0s"></span>
          <span style="animation-delay:.35s"></span>
          <span style="animation-delay:.7s"></span>
          <span style="animation-delay:1.05s"></span>
        </div></div>
        <div class="flow-step" data-step="1">
          <div class="flow-node"></div>
          <div class="flow-step-label">Thông tin cá nhân</div>
        </div>
        <div class="flow-step" data-step="2">
          <div class="flow-node"></div>
          <div class="flow-step-label">Nhận yêu cầu</div>
        </div>
        <div class="flow-step" data-step="3">
          <div class="flow-node"></div>
          <div class="flow-step-label">Đặt lịch</div>
        </div>
        <div class="flow-step" data-step="4">
          <div class="flow-node"></div>
          <div class="flow-step-label">Kết thúc</div>
        </div>
      </div>
    </div>
    <section id="landing" class="fade-in">
      <!-- Corner glows at page edges -->
      <div class="glow-spot corner cyan" style="top:-25%;left:-25%;"></div>
      <div class="glow-spot corner blue" style="top:-20%;right:-30%;"></div>
      <div class="glow-spot corner" style="bottom:-25%;left:-25%;"></div>
      
      <!-- Central area glows -->
      <div class="glow-spot medium" style="top:15%;left:20%;"></div>
      <div class="glow-spot small blue" style="top:75%;right:15%;"></div>
      
      <div class="landing-logo">
        <!-- Behind logo glow - larger, softer -->
        <div class="glow-spot behind-logo" style="top:50%;left:50%;transform:translate(-50%,-50%);"></div>
        <img src="/images/logo_no_background.png" alt="Logo" class="main-logo" />
      </div>
      <h2>Trợ lí ảo Medly</h2>
      <p class="landing-intro" style="max-width:520px; font-size:1rem; line-height:1.45; opacity:.9; font-weight:450; margin:.15rem 0 .4rem;">
        Nhấn để bắt đầu cuộc gọi đặt lịch an toàn và nhanh chóng.
      </p>
      <button id="startBtn" class="landing-primary-cta">
        BẮT ĐẦU
        <span class="small">Cho phép Micro</span>
        <div class="glow-ring-btn"></div>
      </button>
    </section>
    <section id="inCall" class="hidden">
      <div id="infoPanel">
        <h3 id="infoTitle">Thông tin</h3>
        <div id="infoBody" style="font-size:.7rem; opacity:.85;">Đang nhận dữ liệu...</div>
        <!-- Hướng dẫn tương tác theo trạng thái -->
  <div id="infoGuide" class="info-guide" style="margin-top:.5rem; line-height:1.45;"></div>
        <div class="actionsRow" id="infoActions" style="display:none;"></div>
      </div>
      <div id="waveBar">
        <canvas id="waveCanvas"></canvas>
        <audio id="remoteAudio" autoplay playsinline></audio>
        <button id="btnEndCall" aria-label="Kết thúc" title="Kết thúc" class="hangup-btn">
          <img src="icons/phone_white.svg" alt="Kết thúc" />
        </button>
      </div>
      <!-- Thông báo trung tâm (overlay) -->
      <div id="centerNotice">
        <div id="centerNoticeText"></div>
      </div>
      <div id="logPanel">
        <div id="logHeader">LOG HỆ THỐNG <button id="btnCloseLog" class="ghost" style="padding:.35rem .6rem; font-size:.55rem;">Đóng</button></div>
        <ul id="log"></ul>
      </div>
    </section>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
